[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotwmod"
version = "0.1.0"
description = "Predicted-impact bow/crossbow sight overlay and animal population control for theHunter: Call of the Wild (no game files modified)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "PyQt6>=6.5",
  "pynput>=1.7",
  "pymem>=1.13; sys_platform == 'win32'",
  "psutil>=5.9",
  # APC (third_party/apc) runtime deps
  "rich>=13",
  "Babel>=2",
  "FreeSimpleGUI>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cotwmod = "cotwmod.cli:main"

[tool.setuptools.packages.find]
include = ["cotwmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
